<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded rectangle background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="108" ry="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Islamic geometric star (8-pointed star / Rub el Hizb) -->
  <g transform="translate(256,256)" filter="url(#glow)">
    <!-- Outer 8-pointed star -->
    <polygon points="0,-130 37,-37 130,0 37,37 0,130 -37,37 -130,0 -37,-37" fill="white" opacity="0.95"/>
    <polygon points="0,-130 37,-37 130,0 37,37 0,130 -37,37 -130,0 -37,-37" fill="white" opacity="0.95" transform="rotate(45)"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="42" fill="url(#bg)" opacity="0.7"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
    <!-- Inner smaller star -->
    <polygon points="0,-28 8,-8 28,0 8,8 0,28 -8,8 -28,0 -8,-8" fill="white" opacity="0.9"/>
    <polygon points="0,-28 8,-8 28,0 8,8 0,28 -8,8 -28,0 -8,-8" fill="white" opacity="0.9" transform="rotate(45)"/>
  </g>
</svg>
